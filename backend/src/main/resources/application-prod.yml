spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  structured:
    format:
      console: logstash
  level:
    org.hibernate.SQL: warn

app:
  jwt:
    secret: ${JWT_SECRET}
