@if (large()) {
  <div class="toolbar">
    <button type="button" class="nav" aria-label="Mois précédent" (click)="previous()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" /></svg>
    </button>
    <p class="toolbar-title" aria-live="polite">{{ title() }}</p>
    <button type="button" class="nav" aria-label="Mois suivant" (click)="next()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
    </button>
    <button type="button" class="today" (click)="today()">Aujourd’hui</button>
  </div>
}

<full-calendar [options]="options()"></full-calendar>

@if (hovered(); as h) {
  <div class="bubble" [style.top.px]="h.top" [style.left.px]="h.left">
    <strong>{{ h.event.title }}</strong>
    <p>
      {{ h.event.start | date: 'dd/MM/yyyy HH:mm' }}
      @if (h.event.end) {
        → {{ h.event.end | date: 'dd/MM/yyyy HH:mm' }}
      }
    </p>
    @if (h.event.badge) {
      <span class="badge">{{ h.event.badge }}</span>
    }
  </div>
}
