<button
  type="button"
  class="trigger"
  [attr.id]="inputId() || null"
  [disabled]="disabled()"
  aria-haspopup="dialog"
  [attr.aria-expanded]="open()"
  (click)="toggle()"
>
  <span class="trigger-text" [class.placeholder]="!display()">{{ display() || placeholderText() }}</span>
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="3" y="4" width="18" height="18" rx="2" />
    <path d="M16 2v4M8 2v4M3 10h18" />
  </svg>
</button>

@if (open()) {
  <div class="popup" role="dialog" aria-label="Choisir une date" [style]="popupStyle()">
    <div class="header">
      <button type="button" class="nav" aria-label="Année précédente" (click)="shiftYear(-1)">«</button>
      <button type="button" class="nav" aria-label="Mois précédent" (click)="shiftMonth(-1)">‹</button>
      <span class="month-label" aria-live="polite">{{ monthLabel() }}</span>
      <button type="button" class="nav" aria-label="Mois suivant" (click)="shiftMonth(1)">›</button>
      <button type="button" class="nav" aria-label="Année suivante" (click)="shiftYear(1)">»</button>
    </div>

    <div class="weekdays" aria-hidden="true">
      @for (day of weekdays; track $index) {
        <span>{{ day }}</span>
      }
    </div>

    <div class="grid">
      @for (cell of cells(); track cell.iso) {
        <button
          type="button"
          class="day"
          [class.outside]="cell.outside"
          [class.today]="cell.today"
          [class.selected]="cell.selected"
          [attr.aria-pressed]="cell.selected"
          (click)="selectDay(cell)"
        >
          {{ cell.day }}
        </button>
      }
    </div>

    @if (isDateTime()) {
      <div class="time">
        <span class="time-label">Heure</span>
        <select aria-label="Heures" [value]="hour()" (change)="setHour($event)">
          @for (h of hours; track h) {
            <option [value]="h" [selected]="h === hour()">{{ pad(h) }}</option>
          }
        </select>
        <span aria-hidden="true">:</span>
        <select aria-label="Minutes" [value]="minute()" (change)="setMinute($event)">
          @for (m of minutes; track m) {
            <option [value]="m" [selected]="m === minute()">{{ pad(m) }}</option>
          }
        </select>
      </div>
    }

    <div class="footer">
      <button type="button" class="link" (click)="clear()">Effacer</button>
      <button type="button" class="link" (click)="selectToday()">Aujourd'hui</button>
      @if (isDateTime()) {
        <button type="button" class="btn btn-primary confirm" (click)="close()">OK</button>
      }
    </div>
  </div>
}
