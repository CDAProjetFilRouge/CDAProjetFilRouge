<h1>{{ DOCUMENT_TYPE_LABELS[type] }}</h1>

@if (loading()) {
  <p>chargement</p>
} @else if (errorMessage()) {
  <p role="alert">{{ errorMessage() }}</p>
} @else if (document(); as doc) {
  <p class="meta">Version {{ doc.version }} - mise à jour le {{ doc.updateDate | date: 'dd/MM/yyyy' }}</p>

  <div class="content" [innerHTML]="doc.content"></div>
  <a class="btn btn-primary download" [href]="urlBackend + '/PDF/legalDocument/' + doc.id">Télécharger le PDF</a>
}
