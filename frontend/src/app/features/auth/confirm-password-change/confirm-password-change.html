<h1>Changement de mot de passe</h1>

@switch (status()) {
  @case ('loading') {
    <p>Confirmation en cours…</p>
  }
  @case ('success') {
    <p>Ton mot de passe a bien été modifié. Tu peux maintenant te connecter avec le nouveau.</p>
    <button type="button" routerLink="/login">Se connecter</button>
  }
  @case ('error') {
    <p>{{ errorMessage() }}</p>
    <button type="button" routerLink="/account/password">Refaire une demande</button>
  }
}
