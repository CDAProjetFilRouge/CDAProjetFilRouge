<div class="auth-page">
  <div class="auth-card">
    <h1>Changement de mot de passe</h1>

    @switch (status()) {
      @case ('loading') {
        <p class="alert alert-info">Confirmation en cours…</p>
      }
      @case ('success') {
        <p class="alert alert-success">
          Ton mot de passe a bien été modifié. Tu peux maintenant te connecter avec le nouveau.
        </p>
        <button class="btn btn-primary btn-block" type="button" routerLink="/login">
          Se connecter
        </button>
      }
      @case ('error') {
        <p class="alert alert-danger">{{ errorMessage() }}</p>
        <button class="btn btn-primary btn-block" type="button" routerLink="/account/password">
          Refaire une demande
        </button>
      }
    }
  </div>
</div>
