<div class="auth-page">
  <div class="auth-card">
    <h1>Activation du compte</h1>

    @switch (status()) {
      @case ('loading') {
        <p class="alert alert-info">Activation en cours…</p>
      }
      @case ('success') {
        <p class="alert alert-success">Ton compte est activé. Tu peux maintenant te connecter.</p>
        <button class="btn btn-primary btn-block" type="button" routerLink="/login">
          Se connecter
        </button>
      }
      @case ('error') {
        <p class="alert alert-danger">{{ errorMessage() }}</p>
        <button class="btn btn-primary btn-block" type="button" routerLink="/createAccount">
          Créer un compte
        </button>
      }
    }
  </div>
</div>
