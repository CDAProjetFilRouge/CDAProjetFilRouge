<h1>Activation du compte</h1>

@switch (status()) {
  @case ('loading') {
    <p>Activation en cours…</p>
  }
  @case ('success') {
    <p>Ton compte est activé. Tu peux maintenant te connecter.</p>
    <button type="button" routerLink="/login">Se connecter</button>
  }
  @case ('error') {
    <p>{{ errorMessage() }}</p>
    <button type="button" routerLink="/createAccount">Créer un compte</button>
  }
}
