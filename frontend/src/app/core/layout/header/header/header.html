<div class="layout-header">
  <button class="logo" routerLink="/">MyHubEvent</button>
  <div class="page-space">
      <button class="page-select" [routerLink]="user() ? '/' : '/catalogue'" routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">Catalogue</button>

      @if (user()) {
        <button class="page-select" routerLink="/dashboard" routerLinkActive="active">Tableau de bord</button>
        <!-- L'administrateur est un compte métier : pas de calendrier personnel -->
        @if (user()?.role !== 'ADMINISTRATOR') {
          <button class="page-select" routerLink="/calendar" routerLinkActive="active">Mon calendrier</button>
        }
      }

      @if (user()?.role === 'ORGANIZER') {
        <button class="page-select" routerLink="/my-events" routerLinkActive="active">Mes évènements</button>
      }
      @if (user()?.role === 'ADMINISTRATOR') {
        <button class="page-select" routerLink="/admin" routerLinkActive="active">Gestion</button>
      }
  </div>
  <div class="login-space">
    @if (user(); as u) {
      <div class="account">
        <button type="button" class="account-trigger" aria-haspopup="true" [attr.aria-expanded]="menuOpen()"
          (click)="toggleMenu()">
          <span class="avatar" aria-hidden="true">{{ initials() }}</span>
          <span class="identity">
            <span class="name">{{ u.firstName }} {{ u.lastName }}</span>
            <span class="role">{{ roleLabels[u.role] }}</span>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
        </button>

        @if (menuOpen()) {
          <div class="account-menu">
            <a class="menu-item" routerLink="/account" (click)="closeMenu()">Mon compte</a>
            <button type="button" class="menu-item" (click)="logout()">Déconnexion</button>
          </div>
        }
      </div>
    } @else {
      <button class="btn" routerLink="/login">Se connecter</button>
      <button class="btn btn-primary" routerLink="/createAccount">Créer un compte</button>
    }
  </div>
</div>
